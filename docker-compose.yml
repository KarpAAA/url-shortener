# Base stack: database → migrations (once) → api. `docker compose up --build` is all it takes.
# Other compose files extend this one instead of repeating it:
#   docker-compose.dev.yml           publishes Postgres for `pnpm dev` on the host
#   docker-compose.schemathesis.yml  adds the API fuzzer and runs it against `app`
name: url-shortener

x-database-url: &database-url postgresql://shortener:shortener@postgres:5432/shortener

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortener -d shortener']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DATABASE_URL: *database-url
      DATABASE_POOL_SIZE: 10
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHORTEN_RATE_LIMIT: ${SHORTEN_RATE_LIMIT:-30}
      SHORTEN_RATE_TTL_SECONDS: 60
      SHUTDOWN_TIMEOUT_MS: 10000
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 10
    # longer than SHUTDOWN_TIMEOUT_MS, so the drain finishes before SIGKILL
    stop_grace_period: 15s

volumes:
  postgres-data:
